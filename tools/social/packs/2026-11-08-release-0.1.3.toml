# Airc 0.1.3 on Stable (2026-11-08, build 202611081442, source bde185a). Every claim is from its published release
# notes (apps/marketing/src/content/changelog/0.1.3.md, aircbrowser.com/changelog).
slug = "2026-11-08-release-0.1.3"
title = "Airc 0.1.3 release pack"
kind = "release"
since = "0.1.3"
# 0.1.3's own source: its shots as they were then (developer-mode was retaken after it, with 0.1.4's Network button), and
# its videos built from it (tools/social/mac-frames.sh --rev bde185a; notes and sitesearch were drawn from commits
# inside it, e9abd05 and 7244420).
shots_rev = "bde185a"
tag = "New in Airc 0.1.3"
end_title = "Airc 0.1.3"
end_line = "Free for Mac · aircbrowser.com"
summary = """
Airc 0.1.3 shipped on Stable on 2026-11-08. This pack covers it: an announcement image, cards for its headline items,
a four-image set for the rest, videos rendered frame by frame by the app from 0.1.3's own source (Notes, Site Search,
Capture Full Page, Space colours, Developer Mode), a seven-post launch thread, and standalone posts. It also carries the
evergreen videos, now drawn from 0.1.3: the intro, Spaces, moving from Arc, Split View, the sidebar on the right and
private windows (each says the release it came in).
"""
order = """
1. Post 1 (the announcement) on its own, then posts 2–7 as replies under it, a few minutes apart: that's the thread
   (`reply = true`; tools/social/xpost.py posts them that way). No post has a link: X charges a link post far more, and
   the profile links the site. The videos' end cards show it.
2. Pin the intro (post 8) for the week; it says why Airc exists (Arc shuts down on December 22).
3. Then three standalone posts a day, about six hours apart (09:00, 15:00, 21:00 UTC; the owner's ceiling is ten a day,
   replies not counted), in this order: Moving from Arc, Spaces, Space colours, Developer Mode, Split
   View, the sidebar on the right, private windows; then the "also new in 0.1.3" posts (Live Calendar's ⌃⌘J, more
   Split View, Arc's menus, then clean links the next day, Boost links, menus in ⌘T); Reduce Motion any day.
Use the 16:9 images and videos in the thread (X shows them uncropped); the 1:1 versions are for standalone posts and
other networks.
"""
checked = """
- 0.1.3's published notes: every feature named here is in "New since 0.1.2"; nothing else is claimed.
- iCloud Sync: "tested with iCloud on one Mac; syncing between two Macs through iCloud Keychain hasn't been tested
  yet". Its cards carry that line, and post 3 says it.
- Developer Mode: 0.1.3's strip is Inspect, Hard Reload and the console error count. Its shot and video are 0.1.3's own
  (the Network button and ⌃-click to clear site data are 0.1.4's).
- Not claimed (0.1.4, or in no notes yet): Portrait Mode, Boosts off in private windows, the ⌘S and swipe speed-ups,
  site previews, Ask on Page, link previews.
- Live Calendar's ⌃⌘J shipped in 0.1.2 (3f6cce0 has it; the website, 2026-11-08): what's new in 0.1.3 is the calendar
  Favorite's right-click options, and that's what its post says. Boost updates from the author, every menu command in
  ⌘T, ⌥-click to split, Split View Controls, dropping a tab on a saved split and pages following the Space live are
  0.1.3 too (the website's check of its catalog, f283eb2).
- Also new in 0.1.3, not in its notes (the lead's rule, 16:25: in bde185a, passed in the 08:35 run, there for anyone,
  changed since 0.1.2): Arc's menus, clean links and folder Markdown
  (ff27478, e07858f; parityp01), menus in ⌘T and Essential Keyboard Shortcuts (678c7f2; parityp01b), Boost links
  (e527849; boosts2, aircbrowser.com/boost answers), a saved split's icon (splitparity). Split View's post keeps to the
  notes' words (⌥-click separates a split). Still held: Reduce Transparency and the 4.5:1 title contrast (unsure), and
  Developer Mode's Site Controls card (its shot is newer than 0.1.3).
- The Spaces and intro takes use Wikipedia's articles and the demo's own shared folder: no product logo up front, nobody's
  face or name (the website held the earlier swift.org and GitHub take for that).
"""

