# ---------------------------------------------------------------- posts

[[post]]
label = "Announcement (the thread's first post)"
media = ["announce:16x9"]
text = """
Airc 0.1.3 is out.

The big ones: Notes in your sidebar, iCloud Sync, Capture Full Page, and Little Airc from any app. Plus Site Search in ⌘T and a long list of small Arc details.

Free, for Macs with Apple silicon. The download is on our profile.
"""

[[post]]
label = "Notes"
reply = true
media = ["notes-video:16x9"]
text = """
Notes are here. ⌃⇧N drops a note into your sidebar, right next to your tabs. Headings, checklists and pasted Captures all work, and it saves as you type.

Export to Markdown, RTF, PDF or HTML, or bring your Arc notes over. Notes stay on your Mac.
"""

[[post]]
label = "iCloud Sync"
reply = true
media = ["icloud-sync:16x9", "icloud-merge:16x9"]
text = """
iCloud Sync keeps your Spaces, pinned tabs, folders and Favorites the same on your Macs. It's off until you turn it on, end-to-end encrypted, and it backs up your sidebar first.

Honest note: so far we've tested it with iCloud on one Mac, not between two yet.
"""

[[post]]
label = "Capture Full Page"
reply = true
media = ["capture-full-page:16x9"]
text = """
Need the whole page, not just what's on screen? Press ⇧⌘2, then F.
"""

[[post]]
label = "Little Airc from any app"
reply = true
media = ["little-arc:16x9"]
text = """
Little Airc opens from any app now. Turn it on in Settings → Links, then press ⌥⌘N, even over a full-screen app.

Its chevron (⇧⌘O) lists your Spaces. Pick one and the page moves there.
"""

[[post]]
label = "Site Search"
reply = true
media = ["sitesearch-video:16x9"]
text = """
In ⌘T, type yt or wiki, press Tab, and you're searching that site. Add your own in Settings → Site Search.
"""

[[post]]
label = "Also in 0.1.3 (four images)"
reply = true
media = ["dev-mode", "toolbar-extensions", "boost-gallery", "theme-palette"]
text = """
And a pile of smaller things: Developer Mode per site with ⌃D, extensions in the toolbar, a Boost gallery you can try on first, pages in your Space's colours, clearer Arc import results, ⌃Tab back to recent tabs, files you drop on the sidebar, and a link to text you copy.
"""

[[post]]
label = "Intro (pin it)"
# Posted from the Meet Airc pack, among the features (the account starts there).
queue = false
media = ["intro-video:16x9"]
text = """
Arc is shutting down on December 22. We liked it too much to let it go, so we built Airc. Same sidebar, same Spaces, same ⌘T, and it's free and open source.

It's built and maintained by AI agents.
"""

[[post]]
label = "Moving from Arc (video)"
# Posted from the Meet Airc pack, among the features (the account starts there).
queue = false
media = ["import-video:16x9"]
text = """
Leaving Arc before December 22? This is the part you'll care about.

Airc reads Arc's files on your Mac and brings your Spaces, pinned tabs and folders over in about a minute. Each Arc profile stays its own profile.
"""

[[post]]
label = "Spaces (video)"
# Posted from the Meet Airc pack, among the features (the account starts there).
queue = false
media = ["spaces-video:16x9"]
text = """
One sidebar for work. One for the trip you're planning. One for everything else.

Each Space keeps its own tabs and colour, and can have its own profile. Swipe with two fingers to switch.
"""

[[post]]
label = "Space colours on pages (video)"
media = ["themes-video:16x9"]
text = """
New in 0.1.3: pages built for Arc's colour variables pick up your Space's theme, and follow it when you change it.
"""

[[post]]
label = "Developer Mode (video)"
media = ["devtabs-video:16x9"]
text = """
Developer Mode switches itself on for localhost. For any other site, press ⌃D.

You get Inspect, Hard Reload and a count of console errors right under the address.
"""

[[post]]
label = "Split View (video)"
# Posted from the Meet Airc pack, among the features (the account starts there).
queue = false
media = ["split-video:16x9"]
text = """
Map on one side, the article on the other. Split View holds up to four tabs, and it stays one row in your sidebar.

Drag the divider and the pages reflow as you go.
"""

[[post]]
label = "Sidebar on the right (video)"
# Posted from the Meet Airc pack, among the features (the account starts there).
queue = false
media = ["sidebarright-video:16x9"]
text = """
Rather have the sidebar on the right? Settings → Appearance → Sidebar position. Everything works the same over there, swipes included.
"""

[[post]]
label = "Private windows (video)"
# Posted from the Meet Airc pack, among the features (the account starts there).
queue = false
media = ["private-video:16x9"]
text = """
⇧⌘N opens a private window. Its history, cookies and site data are gone when you close it. Your downloads stay where you put them.
"""

[[post]]
label = "Capture Full Page (video)"
media = ["fullpage-video:16x9"]
text = """
The whole page as one picture. ⇧⌘2, then F.
"""

[[post]]
label = "Live Calendar's options (also new in 0.1.3; on its own day)"
media = ["live-calendar:16x9"]
text = """
New in 0.1.3: right-click your calendar Favorite and you get Arc's options for it.

Choose when the meeting link shows up (ten, five or two minutes before, or right at the start), show the time to your next meeting, or turn the hover preview on.
"""

[[post]]
label = "Split View (also new in 0.1.3; on its own day)"
media = ["split-extras:16x9"]
text = """
Split View got a lot more Arc in 0.1.3. ⌥-click a tab to open it beside the page. Each pane's handle has Arc's controls. Drop a tab onto a saved split to add it.

Expand Current Split shows one pane alone, and saved splits can have their own icon.
"""

[[post]]
label = "Arc's menus (also new in 0.1.3; on its own day)"
media = ["tab-menu:16x9"]
text = """
Right-click anything in the sidebar and you get Arc's menu for it: tabs, Favorites, folders, split panes, a selection. New in 0.1.3.

Share sends only the links you picked.
"""

[[post]]
label = "Clean links and Markdown (the next day)"
media = ["folder-markdown:16x9"]
text = """
Copy Link and Share now strip tracking junk like utm_, fbclid and gclid, and tell you when they did.

Copy a folder and you get a Markdown list, nested the way your sidebar is.
"""

[[post]]
label = "Boost links (also new in 0.1.3; on its own day)"
media = ["boost-link:16x9"]
text = """
You can share a Boost as a link now. The whole Boost lives after the # in the link, and browsers never send that part anywhere. No server involved.

Change it later and everyone who added it gets offered the update.
"""

[[post]]
label = "Menus in ⌘T and Essential Keyboard Shortcuts (another day)"
media = ["essential-shortcuts:16x9"]
text = """
Can't find something in the menu bar? Type it in ⌘T. "read aloud" finds Start Speaking.

And if you forget a shortcut, Help → Essential Keyboard Shortcuts shows the ones that matter most, the way you've set them. Both new in 0.1.3.
"""

[[post]]
label = "Reduce Motion (text only, any day)"
text = """
If you have Reduce Motion on, Airc 0.1.3 cross-fades the sidebar and long Space switches instead of sliding them.
"""

