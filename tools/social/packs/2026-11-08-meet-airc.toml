# Meet Airc (2026-11-08): the account's start. It was empty, so the owner asked for the general idea and the features
# first, then the releases and what came after. Every feature here is released (0.1.0 to 0.1.3); the words are the
# homepage catalog's (apps/marketing/src/data/catalog.ts) or the release notes'. No version tags: these are what Airc is.
slug = "2026-11-08-meet-airc"
title = "Meet Airc: the idea and the features"
kind = "release"
since = "0.1.3"
shots_rev = "bde185a"
tag = ""
end_title = "Arc, kept going."
end_line = "Free and open source, for Mac"
summary = """
The first posts on an empty account: a thread that says what Airc is and why (Arc shuts down on December 22), with the
core features as pictures in its replies; then one feature a day, mostly short videos rendered by the app itself. The
0.1.3 release and its features follow in their own pack, then what's coming.
"""
order = """
1. Post 1 with posts 2–7 as replies: the thread (xpost.py posts it in one go).
2. Then the single posts, one a slot, in this order. The intro is the one to pin (by hand: X's API can't pin).
"""
checked = """
- Every claim is a released feature in the homepage catalog (since 0.1.0 to 0.1.3) or the published release notes.
- Arc's import: "saved passwords", not "logins": partitioned cookies and Sign in with Google don't come over.
- The videos named here come from released sources: 0.1.2's (Command Bar, Capture, Select tabs, Boosts) and 0.1.3's
  (the intro, Spaces, Moving from Arc, Split View, the sidebar on the right, private windows), all on demo data.
"""

