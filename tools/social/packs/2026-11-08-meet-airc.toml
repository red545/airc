[[post]]
label = "Meet Airc (the account's first post)"
media = ["hero:16x9"]
text = """
Arc is shutting down on December 22.

Airc keeps it going: a free, open-source Mac browser with Arc's sidebar, Spaces and ⌘T. Your Arc comes over in about a minute.

Built and maintained by AI agents. A person signs off every release.
"""

[[post]]
label = "⌘T"
reply = true
media = ["command:16x9"]
text = """
⌘T: search, open a site, jump to a tab or a Space, or run an action. Results as you type.
"""

[[post]]
label = "From Arc"
reply = true
media = ["from-arc:16x9"]
text = """
From Arc in about a minute: Spaces, pinned tabs, folders, Favorites and saved passwords, read from Arc's files on your Mac. Nothing is uploaded.
"""

[[post]]
label = "Split View"
reply = true
media = ["split:16x9"]
text = """
Split View: two to four pages side by side, as one row in your sidebar.
"""

[[post]]
label = "Little Arc"
reply = true
media = ["little-arc:16x9"]
text = """
Little Arc: a link from Mail or Slack opens in a small window. ⌘O moves the page into a Space.
"""

[[post]]
label = "Boosts"
reply = true
media = ["boosts:16x9"]
text = """
Boosts: give any site your own colours and font, or zap the parts you never want to see. Share one with a friend.
"""

[[post]]
label = "And more (four images)"
reply = true
media = ["profiles", "peek", "capture", "notes"]
text = """
And: a profile per Space (two Gmail accounts, one window), Peek for links from pinned tabs, Capture with ⇧⌘2, and Notes in your sidebar.

Free, for Macs with Apple silicon.
"""

[[post]]
label = "Intro video (pin it)"
media = ["2026-11-08-release-0.1.3/intro-video:16x9"]
text = """
Arc is shutting down on December 22. We liked it too much to let it go, so we built Airc. Same sidebar, same Spaces, same ⌘T, and it's free and open source.

It's built and maintained by AI agents.
"""

[[post]]
label = "⌘T (video)"
media = ["commandbar-video:16x9"]
text = """
Most things in Airc start with ⌘T. Type a few letters and it finds the open tab, the page from last week, or a search. No mouse needed.
"""

[[post]]
label = "Moving from Arc"
# The card, not the video: the build Mac was away when this was due (2026-11-09); the video goes out on its own below.
media = ["from-arc:16x9"]
text = """
Leaving Arc before December 22? This is the part you'll care about.

Airc reads Arc's files on your Mac and brings your Spaces, pinned tabs and folders over in about a minute. Each Arc profile stays its own profile.
"""

[[post]]
label = "Capture (video)"
media = ["capture-video:16x9"]
text = """
⇧⌘2, drag over the bit you want, done. Copy it, save it or share it.

Airc doesn't need screen-recording permission for this.
"""

[[post]]
label = "Spaces (video)"
media = ["2026-11-08-release-0.1.3/spaces-video:16x9"]
text = """
One sidebar for work. One for the trip you're planning. One for everything else.

Each Space keeps its own tabs and colour, and can have its own profile. Swipe with two fingers to switch.
"""

[[post]]
label = "Boosts (video)"
media = ["boosts-video:16x9"]
text = """
Wikipedia, but warm and bookish? That's a Boost. Give any site your own tint and font, and click away the parts you never read.
"""

[[post]]
label = "Split View (video)"
media = ["2026-11-08-release-0.1.3/split-video:16x9"]
text = """
Map on one side, the article on the other. Split View holds up to four tabs, and it stays one row in your sidebar.

Drag the divider and the pages reflow as you go.
"""

[[post]]
label = "Select several tabs (video)"
media = ["multiselect-video:16x9"]
text = """
Too many tabs about the same thing? ⌘-click them, or ⇧-click a range, and put them in a folder in one go. Undo works if you change your mind.
"""

[[post]]
label = "A profile per Space"
media = ["profiles:16x9"]
text = """
Two Gmail accounts, one window. Give a Space its own profile and it keeps its own logins, history and passwords.
"""

[[post]]
label = "Peek"
media = ["peek:16x9"]
text = """
Click a link in a pinned tab and it opens in Peek, a card over the page, so you don't lose your place. ⌘O turns it into a real tab.
"""

[[post]]
label = "Sidebar on the right (video)"
media = ["2026-11-08-release-0.1.3/sidebarright-video:16x9"]
text = """
Rather have the sidebar on the right? Settings → Appearance → Sidebar position. Everything works the same over there, swipes included.
"""

[[post]]
label = "Private windows (video)"
media = ["2026-11-08-release-0.1.3/private-video:16x9"]
text = """
⇧⌘N opens a private window. Its history, cookies and site data are gone when you close it. Your downloads stay where you put them.
"""

