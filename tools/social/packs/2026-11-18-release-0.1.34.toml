[[post]]
label = "Import from Dia"
text = """
Tried Dia and want your stuff back in an Arc-style browser? Airc 0.1.34 imports from Dia: profiles, bookmarks, history, search engines, extensions, and with one macOS prompt, saved passwords and cookies. Dia's sidebar can't come over; Dia keeps it encrypted.
"""

[[post]]
label = "Rules for each connected app"
text = """
New in Airc 0.1.34: rules for each AI app that uses your browser. Pick the one profile it may use and sites it may never open, and choose the only folder it can upload files from. What it downloads goes to its own folder.
"""

[[post]]
label = "Agents tell you when a page needs you"
text = """
When an AI agent in Airc hits a sign-in page or a captcha, it now says so: its row shows Needs you, the Agents folder gets a badge, and you get a notification. Take over, sign in, and it carries on. New in Airc 0.1.34.
"""
