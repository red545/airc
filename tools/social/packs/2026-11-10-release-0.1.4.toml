# ---------------------------------------------------------------- posts

[[post]]
label = "Announcement (the thread's first post)"
media = ["announce:16x9"]
text = """
Airc 0.1.4 is out.

New: Easels, built-in ad and tracker blocking, passkeys on this Mac, Cast, GitHub Live Folders, Tidy Tabs and sharing a Space as a link. Plus Ask ChatGPT from ⌘T.

Free, for Macs with Apple silicon. The download is on our profile.
"""

[[post]]
label = "Easels"
reply = true
media = ["easel:16x9"]
text = """
⌃⇧E opens an Easel: a canvas for text, pictures, shapes, arrows, links and Captures. Arrange, resize, group and snap them into place.

Undo survives a relaunch. Your boards are in Library › Easels, and they stay on your Mac.
"""

[[post]]
label = "Ad and tracker blocking"
reply = true
media = ["blocking:16x9"]
text = """
Ad and tracker blocking is built in and on by default, including in profiles that hadn't chosen yet.

Turn it off for a site in Site Controls, or for a whole profile in Settings. A choice you've made is kept.
"""

[[post]]
label = "Passkeys"
reply = true
text = """
Passkeys on this Mac: signed builds of Airc can save them in your profile, using the Mac's secure storage.

Each profile keeps its own. Delete the profile and its passkeys go with it. iCloud Keychain passkeys aren't in this release.
"""

[[post]]
label = "Cast"
reply = true
media = ["cast:16x9"]
text = """
View › Cast… opens a picker for Chromecast and Google TV on your network, and the sidebar shows what's casting.

Honest note: we've tested it without a real TV so far. Sites that play in Safari's engine use AirPlay instead.
"""

[[post]]
label = "GitHub Live Folders"
reply = true
media = ["live-folders:16x9"]
text = """
GitHub Live Folders follow a repository's pull requests, or yours, or your review requests. New ones arrive, merged and closed ones leave.

Public repositories work without an account.
"""

[[post]]
label = "Also in 0.1.4 (four images)"
reply = true
media = ["tidy-tabs:16x9", "share-space:16x9", "ask-chatgpt:16x9", "portrait:16x9"]
text = """
Also new: Tidy Tabs groups Today's tabs into folders with Apple Intelligence, Share Space… makes a link anyone can open, ⌘T can ask ChatGPT, and Capture has a Portrait Mode.
"""

[[post]]
label = "Capture in Portrait Mode (video)"
media = ["portrait-video:16x9"]
text = """
Capture in Portrait Mode frames a page on a colour, ready to share. It's in View and in Site Controls. New in Airc 0.1.4.
"""

[[post]]
label = "Developer Mode's toolbar (video)"
media = ["devtoolbar-video:16x9"]
text = """
Developer Mode's toolbar now has Inspect, Network, Console, and Clear data and reload. It's on by itself for localhost, and ⌃D away anywhere else. New in 0.1.4.
"""

[[post]]
label = "Site previews (video)"
media = ["sitepreview-video:16x9"]
text = """
Rest your pointer on a pinned Linear, Figma or Notion and see the pages you were just on. It comes from your own history on your Mac. New in Airc 0.1.4.
"""

[[post]]
label = "Ask ChatGPT from ⌘T"
media = ["ask-chatgpt:16x9"]
text = """
In ⌘T, type gpt and press Tab. Return opens your question on ChatGPT in a new tab; Perplexity and Claude are choices too.

Turn on Ask AI in Settings → Site Search. Nothing is sent until you press Return. New in 0.1.4.
"""

[[post]]
label = "Tidy Tabs"
media = ["tidy-tabs:16x9"]
text = """
Too many tabs in Today? Click Tidy and Apple Intelligence groups them into folders on your Mac. ⌘Z puts them back. New in Airc 0.1.4.
"""

[[post]]
label = "Share a Space"
media = ["share-space:16x9"]
text = """
Share Space… makes a link to a Space that opens in any browser. You pick what's in it, and you can revoke it later. New in 0.1.4.
"""

[[post]]
label = "Your app icon"
media = ["app-icon:16x9"]
text = """
Airc 0.1.4 lets you pick its icon in Settings → Appearance: Holographic or Outline. There are sound and haptic controls too.
"""
