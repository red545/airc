# Airc 0.1.4 on Stable (2026-11-10 13:51 UTC, build 202611101310, source f35bc013). Every claim is from its approved
# notes (docs/release-notes-beta.md, d5b58289; aircbrowser.com/changelog).
slug = "2026-11-10-release-0.1.4"
title = "Airc 0.1.4 release pack"
kind = "release"
since = "0.1.4"
# 0.1.4's own source: its shots as they were in the cut, and its videos built from it (tools/social/mac-frames.sh
# --rev f35bc013).
shots_rev = "f35bc013"
tag = "New in Airc 0.1.4"
end_title = "Airc 0.1.4"
end_line = "Free for Mac · aircbrowser.com"
summary = """
Airc 0.1.4 shipped on Stable on 2026-11-10. This pack covers it: an announcement image, cards for its headline items,
videos rendered frame by frame by the app from 0.1.4's own source (Capture in Portrait Mode, Developer Mode's toolbar,
site previews), a launch thread and standalone posts. It replaces the coming-soon teasers for the features that shipped.
"""
order = """
1. Post 1 (the announcement) on its own, then the thread's replies under it, a few minutes apart. No links in any post.
2. Then the standalone posts, one per slot, in the order below.
"""
checked = """
- 0.1.4's approved notes (docs/release-notes-beta.md, "New since 0.1.3" and "Also improved"): every feature named here
  is there; nothing else is claimed.
- Not claimed: automatic updates from 0.1.3 (the upgrade proof failed on the build Mac's network and isn't proven);
  live Captures, freehand drawing, export, sharing or sync of Easels; iCloud Keychain passkeys; Cast on a real TV.
- Kept true from "Please know": Safe Browsing is off (not in a teaser post, and nothing says otherwise); Cast was tested
  without a real receiver (its card shows the picker with no devices, and its post says so); passkeys are local to
  the profile; Tidy Tabs needs Apple Intelligence; Ask ChatGPT sends nothing until Return.
- Shots from the cut (f35bc013) only, on demo data. Left out: the extension results shot (it shows the sidebar's Sign
  in to Google card), the update shot (a person's face on apple.com), the cut's developer-mode still (the older strip;
  the toolbar comes from the 0.1.4 video), easel-live (live Captures aren't in 0.1.4).
"""

