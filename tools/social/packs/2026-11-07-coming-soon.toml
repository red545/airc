# Coming soon (updated 2026-11-08, after Airc 0.1.3 shipped): features in the repo that no release has shipped yet.
# Each image and post says so. What 0.1.3 shipped moved to its pack (2026-11-08-release-0.1.3); what's in 0.1.3's source
# but not its notes is held (not here, not there) until the lead says.
slug = "2026-11-07-coming-soon"
title = "Coming soon: Portrait Mode, Developer Mode's Network, site previews, Ask on Page and link previews"
kind = "teaser"
# As apps/marketing/src/data/catalog.ts says it: in the repo for a release after 0.1.3.
since = "next"
tag = "Coming soon"
note = "In development. Not in Airc 0.1.3."
end_title = "Coming to Airc"
end_line = "In development. Not in Airc 0.1.3 yet · aircbrowser.com"
summary = """
A teaser for features that are in the repo but in no release yet: Capture in Portrait Mode, Developer Mode's toolbar
with Network, site previews (Notion, Linear, Figma, Confluence), and Ask on Page and link previews (both with Apple
Intelligence, on the Mac). Every image carries a "Coming soon" tag and the line "In development. Not in Airc 0.1.3.";
every post says it isn't in 0.1.3. Nothing here says when they ship.
"""
order = """
Post these a few days after the 0.1.3 thread, not on the same day, so nobody reads them as part of 0.1.3.
1. Post 1 (Ask on Page), then post 2 (link previews) as its reply.
2. Posts 3 (Portrait Mode), 4 (Developer Mode's Network) and 5 (site previews) on their own days.
When a release ships one of these, retire its teaser: the release pack replaces it.
"""
checked = """
- 0.1.3's published notes (aircbrowser.com/changelog): none of these is in them. The website agent: Portrait Mode, the
  Developer Mode toolbar (Network, Control-click to clear site data), Boosts off in private windows and the ⌘S and swipe
  speed-ups come with 0.1.4.
- Ask on Page and link previews: docs/user/ai.md (on the Mac with Apple Intelligence, off until turned on, nothing sent
  to Apple or anyone else for them; a link preview loads the page like a visit, so the posts don't say "nothing leaves
  the Mac").
- Capture in Portrait Mode: the notes agent's shot (9bff2dc); never the desktop picture in our own frames (it's the
  person's own).
- Updates, app icon, sounds (P21b, f742f48, not in 0.1.3): docs/user/updates.md. update-playing as retaken in
  58be020 (never 14e4ab1's, which showed apple.com's region banner), cropped to the sidebar; settings-app-icon is fine.
- Site previews: docs/user/previews.md (5f38130; Notion, Confluence, Figma and Linear list the pages visited there in
  this profile, from its own history: nothing fetched, nothing sent; "+" for a new page). Shot 10c6a8f from the notes
  agent, demo content. Gmail, Outlook and calendar previews aren't in release builds: not posted.
- Held, in 0.1.3's source but not its notes (work/held-0.1.3.toml outside the repo): Split View's icons and more, Live
  Calendar's ⌃⌘J, Boost links, Arc's tab and folder menus, clean links and Markdown, menus in ⌘T and Essential Keyboard
  Shortcuts, and the accessibility post.
"""

