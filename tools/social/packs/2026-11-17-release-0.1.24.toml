# Airc 0.1.24 (cut 1e36f511; build revision ef878a1e; notes on release/0.1.24-notes). Claims from its approved notes,
# "New since 0.1.23". NOT TO POST before release036 posts LIVE for 0.1.24 (with the signed build's link-paint numbers):
# plan and approve only then, after checking the public repo shows the release (owner rule).
slug = "2026-11-17-release-0.1.24"
title = "Airc 0.1.24: fast links, a better agent"
kind = "release"
since = "0.1.24"
tag = "Beta in Airc 0.1.24"
end_title = "Airc 0.1.24"
end_line = "Free for Mac · aircbrowser.com"
summary = """
Three single posts: links open fast when Airc is closed (text, the first measured speed post), then the agent's hand-off
to Claude and its memory, on cards cropped from release036's own screenshots of the panel.
"""
order = """
1. Links first at 10:30 UTC (or 15:00 if 10:30 is taken) on the first free day after LIVE; the agent posts on the next
   two days.
"""
checked = """
- Links: click a link in another app while Airc isn't running and its page shows in about a second, even on the first
  launch; it used to take up to 6 seconds. Please know, kept: macOS sometimes adds up to about a second, so the post
  originally said "usually". At LIVE: release036's signed build measured Chromium first launch ever 0.93 s (0.1.23
  6.68 s), warm median 1.21 s, no pre-main delay in any run; and 0.1.25's notes clarified the 0.1.24 line (Chromium
  even on the first launch; WebKit's first launch still prepares its rules once). So the post says "with the Chromium
  engine, the default" and drops "usually". No comparison with other browsers (linklaunch has Chrome at 0.7 s).
- Agent: replies stream and Stop ends them at once; the approval card in Watch; optional memory (off by default,
  Settings › AI › Agent › Memory; read, edit, undo or clear; refuses passwords, codes and card numbers); "Ask Airc to…"
  in the Command Bar; "Hand to Claude Desktop" or "Hand to Claude Code" once Airc is connected to it. Still a beta,
  on your own Anthropic or OpenAI API key, billed by the provider: both agent posts say so.
- Shots: release036's (artifacts/agentpanel2/shots, chromium), copied to scratch/social-shots/marketing so the studio
  finds them by name, each cropped to the panel's top: the hand-off card, and memory's "Done, and noted" with the
  refused one-time code. Both are the panel alone, on fixture data; no loopback address in either crop.
"""

