[[post]]
label = "Links open fast when Airc is closed"
text = """
Click a link in another app while Airc is closed, and its page now shows in about a second, even on Airc's very first launch with the Chromium engine, the default. It used to take up to 6 seconds. Ad and tracker blocking still covers it from the first request.
"""

[[post]]
label = "Agent: hand it to Claude"
# Text only since 2026-11-18: the hand-off card shows "with your Claude plan", and release044 asked for no plan or
