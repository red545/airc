media = []
text = """
Airc Agent (beta) can now hand a task to Claude Desktop or Claude Code if you'd rather use your Claude app. Or run it in Airc on your own API key: replies stream in, Stop ends them at once, and "Ask Airc to…" in ⌘T starts a task.
"""

[[post]]
label = "Agent: memory you can read"
media = ["memory:16x9"]
text = """
Airc Agent (beta) can now remember between tasks, if you turn it on: short notes you can read, edit, undo or clear. It refuses to keep passwords, codes or card numbers. Off by default; runs on your own API key, billed by your provider.
