# Airc 0.1.5 on Stable (2026-11-11 ~23:40 UTC, build 202611112249, source cabfbaac). Every claim is from its approved
# notes (docs/release-notes-beta.md at 20ecf3cb; aircbrowser.com/changelog).
slug = "2026-11-12-release-0.1.5"
title = "Airc 0.1.5 release pack"
kind = "release"
since = "0.1.5"
# 0.1.5's own source: its shots as committed in the cut.
shots_rev = "cabfbaac"
tag = "New in Airc 0.1.5"
end_title = "Airc 0.1.5"
end_line = "Free for Mac · aircbrowser.com"
summary = """
Airc 0.1.5 shipped on Stable on 2026-11-11. This pack covers it: an announcement image, cards for Easel links, Live
Captures and Notes sync from the cut's own shots, a launch thread and standalone posts. The cut has no new shots of
the tab menus, the Command Bar's icons, Favorites' unread dots, the password manager step or Library's media filters,
so those posts are text only.
"""
order = """
1. Post 1 (the announcement) on its own, then the thread's replies under it, a few minutes apart. No links in any post.
2. Then the standalone posts, one per slot, in the order below.
"""
checked = """
- 0.1.5's approved notes (docs/release-notes-beta.md at 20ecf3cb, "New since 0.1.4" and "Also improved"): every feature
  named here is there; nothing else is claimed.
- Not claimed: automatic updates (not proven end to end); Easel sync between Macs, freehand drawing or editing a
  shared Easel together; Notes sync between two Macs (exercised with real iCloud on the build Mac only; the post says
  so); anything about Cast on a real TV.
- Kept from "Please know": the passkeys warning (no Touch ID: a sign-in may complete without the Mac password; a fix
  is coming) is its own reply in the thread, word for word from the notes. Safe Browsing stays off (nothing says
  otherwise).
- Shots from the cut (cabfbaac) only, on demo data: easel-share, easel-live, settings-sync. settings-sync is clipped to
  its iCloud switch and the encryption line: its device list shows two Macs, and two-Mac delivery isn't qualified.
- The Live Captures video (added 2026-11-13, after the first recap: single feature videos do best) is rendered frame by
  frame by the app from 0.1.5's source (mac-frames.sh --rev cabfbaac), on the demo's own flight and forecast pages;
  the flight page's change (On time to Boarding) is a fixture, served by the demo server.
"""

