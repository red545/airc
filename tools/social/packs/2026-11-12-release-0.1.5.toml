# ---------------------------------------------------------------- posts

[[post]]
label = "Announcement (the thread's first post)"
media = ["announce:16x9"]
text = """
Airc 0.1.5 is out.

New: Notes sync through iCloud, Easel exports and share links, Live Captures in Easels, more useful tab menus, clearer ⌘T results and unread dots on more Favorites.

Free, for Macs with Apple silicon. The download is on our profile.
"""

[[post]]
label = "Easel exports and links"
reply = true
media = ["easel-share:16x9"]
text = """
Easels can leave your Mac now. Save a board or a selection as a PNG or an offline web page, copy it as a picture, or send it with Share….

Share Link… makes a read-only page anyone with the link can open. You see what will be published first, and can take the link back.
"""

[[post]]
label = "Live Captures"
reply = true
media = ["easel-live:16x9"]
text = """
Captures on an Easel can stay live: they refresh from their source page, and you can interact with them. Boards that are off screen stay quiet.
"""

[[post]]
label = "Notes sync"
reply = true
media = ["notes-sync:16x9"]
text = """
Pinned Notes and their pictures can sync through iCloud, encrypted with the rest of your sidebar. An open note follows changes as they come in, and conflicting edits keep a separate copy.

Honest note: so far we've exercised it with real iCloud on one Mac.
"""

[[post]]
label = "Tab menus and ⌘T"
reply = true
text = """
Tab menus do more: Move to › lists the current Space's folders, and with tabs selected, Archive Tabs Below and Archive Other Tabs clear the rest.

⌘T adds Mute All Tabs and Pin to a folder. Sites there show their icons, and known official addresses get a check mark.
"""

[[post]]
label = "Also in 0.1.5"
reply = true
text = """
Also new: more Favorites show an unread dot (Slack's with its count), setup asks which password manager you use, Library's media can be filtered and Quick Looked with Space, Little Airc can open over a full-screen app, and picture in picture reopens more reliably.
"""

[[post]]
label = "Passkeys heads-up (from Please know)"
reply = true
text = """
A heads-up on passkeys: on a Mac where Touch ID isn't available (no sensor, or the lid closed), Airc may complete a passkey sign-in after Continue without asking for your Mac password.

A fix is coming in the next update.
"""

[[post]]
label = "Your password manager at setup"
text = """
New in Airc 0.1.5: setup asks about your password manager. Choose 1Password, Bitwarden, Apple Passwords or another one, keep Airc's own, or skip the step.

You can find it again in Settings → Import.
"""

[[post]]
label = "Library media"
text = """
Library › Media in Airc 0.1.5: filter by Images, Videos or Captures, press Space for Quick Look, and Delete with Undo.

Right-click the Library button to choose which recent files it shows.
"""

[[post]]
label = "Live Captures (standalone)"
media = ["easel-live:16x9"]
text = """
An Easel can hold live Captures now, like a flight's gate or the week's forecast, refreshing from their own pages. New in Airc 0.1.5.
"""

[[post]]
label = "Today folders"
text = """
Arc import keeps Today's folders together now, and New Folder with N Tabs makes the folder in the selected tabs' own section. New in 0.1.5.
"""

[[post]]
label = "Live Captures (video)"
media = ["easellive-video:16x9"]
text = """
Capture part of a page onto an Easel and it stays live. When the page changes, the Capture on your board changes with it. New in Airc 0.1.5.
"""
