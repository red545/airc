# The intro: one take of the app (0.1.2's own source), the homepage's hook before it. For a pinned post and the homepage.
[[post]]
label = "Announcement (the thread's first post)"
media = ["announce:16x9"]
text = """
Airc 0.1.2 is out.

Select several tabs at once, capture part of a page with ⇧⌘2, open streaming sites in a tab, and bring your bookmarks over from Chrome, Firefox or Zen.

Free, for Macs with Apple silicon: aircbrowser.com
"""

[[post]]
label = "Select several tabs"
media = ["multi-select:16x9"]
text = """
⌘-click tabs to select them, or ⇧-click for a range. Then move, pin, archive or duplicate them together, or drag them to another Space or window.

Undo covers all of it. Esc clears the selection.
"""

[[post]]
label = "Capture"
media = ["capture-video:16x9"]
text = """
Capture: press ⇧⌘2, drag over part of the page, then copy, save or share the image.

Space takes the whole visible page; ⌘-click picks a single element. It works in private windows too.
"""

[[post]]
label = "Streaming sites"
media = ["streaming:16x9"]
text = """
Spotify, Netflix, Disney+ and other supported services now open with Safari's engine (WebKit and FairPlay), in the same tab, a split or Little Arc.

We've checked them logged out; playback with a real subscription is still untested.
"""

[[post]]
label = "Boosts and Developer Mode"
media = ["boosts:16x9", "developer-mode:16x9"]
text = """
Boosts: make one from Site Controls, share it as a file, and review someone else's before you install it. Shared JavaScript needs your OK.

Developer Mode (Settings → General) shows a dev page's host and port, Inspect, Hard Reload and a count of console errors.
"""

[[post]]
label = "Also in 0.1.2 (four images)"
media = ["more-sidebar-right", "more-windows", "more-shortcuts", "more-import"]
text = """
Also in 0.1.2: private windows, more than one window, tab previews, shortcuts you can change, the sidebar on the right, and imports from Chrome, Firefox and Zen.

All the notes: aircbrowser.com/changelog
"""

[[set]]
title = "The four-image set"
about = "Post 6's images, in this order (X fills its 2 × 2 grid left to right, top to bottom)."
media = ["more-sidebar-right", "more-windows", "more-shortcuts", "more-import"]
