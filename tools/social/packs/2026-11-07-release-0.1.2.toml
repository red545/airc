# Airc 0.1.2 on Stable (2026-11-07). Every claim is from the release notes (0.1.2's notes.md, build 202611071736).
slug = "2026-11-07-release-0.1.2"
title = "Airc 0.1.2 release pack"
kind = "release"
since = "0.1.2"
# 0.1.2's own source: its shots as they were then (some were retaken later, showing newer UI), and its videos built from it.
shots_rev = "3f6cce0"
tag = "New in Airc 0.1.2"
summary = """
Airc 0.1.2 shipped on Stable on 2026-11-07. This pack covers its headline items: an announcement image, six feature
cards, a four-image set for the rest, short videos (Capture, Select several tabs, Boosts and the Command Bar, rendered
frame by frame by the app) and a six-post launch thread.
"""
order = """
1. Post 1 (the announcement) on its own, then posts 2–6 as replies under it, a few minutes apart: that's the thread.
2. Pin post 1 for the week.
3. The Spaces and intro videos moved to the 0.1.3 pack (drawn from 0.1.3's source, on new pages).
4. Over the following days: single feature cards as standalone posts, one a day, in this order: Capture, Select several
   tabs, Boosts, Developer Mode, Private windows, Streaming sites. Each uses its card's post text below, shortened.
Use the 16:9 images in the thread (X shows them uncropped). The 1:1 versions are for standalone posts and other
networks.
"""
checked = """
- The 0.1.2 release notes (stable/0.1.2-202611071736/notes.md): every feature named here is in "New since 0.1.0".
- Streaming: the notes say checks were logged out only and subscription playback is untested; post 4 says so.
- Capture: visible page only (not scrolling), as the notes say; post 3 doesn't promise more.
- Not mentioned anywhere: iCloud Sync, Ask on Page, link previews, Tidy Downloads, Notes (not in 0.1.2).
"""

