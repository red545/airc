# Airc 0.1.16, the agent release (cut c68f39e3, release/0.1.16-cut; build revision 24552a35 adds only the notes, What's
# New, catalog and changelog). Every claim is from its approved notes (docs/release-notes-beta.md at 24552a35, "New
# since 0.1.15", as release028 sent them 2026-11-15) or docs/user/agents.md. NOT TO POST before release028 posts LIVE
# for 0.1.16 in briefs/queue.md: approve only then.
slug = "2026-11-15-release-0.1.16"
title = "Let Claude use your browser: Airc 0.1.16"
kind = "release"
since = "0.1.16"
shots_rev = "c68f39e3"
tag = "New in Airc 0.1.16"
end_title = "Let Claude use your browser."
end_line = "Airc · Free for Mac · aircbrowser.com"
summary = """
The agent launch the owner asked for ("a bigger story on x"): a 7-post thread led by the hero video (Claude works in
Airc; the Agents folder lights up; you watch it click and type; you take over), then single posts over ten days.
Cards from the cut's own shots (agentview's agents-watch, agents-approval, settings-agents, settings-agents-activity);
videos from the cut's own build (tools/social/mac-frames.sh --motions agent-hero,agent-login --rev c68f39e3), on
synthetic sites only.
"""
order = """
1. Launch, 10:30 UTC on the first day after LIVE: post 1 with posts 2-7 as replies.
2. Then posts 8-12, one a day at 10:30.
"""
checked = """
- 0.1.16's notes, item 1 (See what your AI agent is doing): Agents folder with each agent tab ("Claude · Mailbox"),
  watch live with each click and the field typed into highlighted, Take over (the page becomes your tab), Stop (ends
  the agent's session), a banner when an agent starts, Settings › Agents › Activity (last 7 days, sites and kinds of
  actions, never what they read or typed), Show agent pages in front. docs/user/agents.md for the rest (asks once,
  passwords filled never shown, private windows, setup).
- Please know, kept: Watch is live on Chromium (the default engine); on WebKit it updates about 15 times a second, so
  no post says "every engine". Claude Desktop hasn't been tried with a released build: posts say "Claude" and name
  Claude Desktop only as Settings' button (the owner used it on a signed build, per the lead). No other app is named
  as working; Settings' "Cursor, Codex, VS Code" line shows on the setup card, the post says "other MCP apps".
- Not claimed: the setup clip (its demo's activation fix isn't in the cut), cross-device (mcpremote hasn't shipped),
  speed beyond the notes' own numbers. No competitor named.
- Demo honesty: the client in every shot and video is Airc's own test client named Claude ("Started by Airc itself"
  shows in the ask and in Settings); alts say so; no post calls a video a recording of Claude Desktop.
"""

