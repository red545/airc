# ---------------------------------------------------------------- posts

[[post]]
label = "Launch: watch Claude use your browser (hero video)"
media = ["hero-video:16x9"]
text = """
Watch Claude use your browser.

When Claude or another AI app uses Airc, an Agents folder appears in your sidebar. Click an agent to watch it live, each click and field highlighted, and take over whenever you like.

New in Airc 0.1.16.
"""

[[post]]
label = "It asks first"
reply = true
media = ["ask:16x9"]
text = """
It starts with a question. The first time an app connects, Airc asks once: Allow 'Claude' to use Airc?

It can act in your signed-in sites, in the profiles you allow. It never sees your saved passwords or your private windows.
"""

[[post]]
label = "The Agents folder"
reply = true
media = ["watch:16x9"]
text = """
Agents work in pages of their own, so your tabs stay as you left them. A banner tells you when one starts, and the Agents folder shows each one: Claude · Mailbox, Claude · Corner Shop.
"""

[[post]]
label = "Passwords: filled, never shown (video)"
reply = true
media = ["2026-11-15-agents-login/login-video:16x9"]
text = """
Claude can sign in with a login you saved without ever seeing it: Airc fills the form itself.

Reading a page hides password, one-time code and card fields.
"""

[[post]]
label = "Activity"
reply = true
media = ["activity:16x9"]
text = """
Settings › Agents › Activity lists what agents did in the last 7 days: the sites and the kinds of actions. Never what they read or typed, and it stays on your Mac.
"""

[[post]]
label = "Setup"
reply = true
media = ["setup:16x9"]
text = """
Setup is one click in Settings › Agents: Add to Claude Desktop, Add to Claude Code, or copy the JSON for other MCP apps.
"""

[[post]]
label = "The browser you live in"
reply = true
text = """
Arc shuts down on December 22. Airc is the Arc-style browser for Mac: your Spaces, your sidebar, and now your own AI working in the browser you already live in.

Free. The download is on our profile.
"""

[[post]]
label = "Take over and Stop (video)"
media = ["takeover-video:16x9"]
text = """
You're one click from the wheel. Watch Claude work, then Take over and the page becomes your own tab. Stop ends the agent's session. New in Airc 0.1.16.
"""

[[post]]
label = "Passwords (video)"
media = ["2026-11-15-agents-login/login-video:16x9"]
text = """
Claude signed in to this site with a login saved in Airc, and never saw the password. Airc fills the form itself; when Claude reads the page, the password shows as hidden.
"""

[[post]]
label = "In front, or out of sight"
media = ["infront:16x9"]
text = """
Want to see agents as they start? Settings › Agents › Show agent pages in front opens an agent's page in your window. Leave it off and they work out of sight; watch any time from the Agents folder.
"""

[[post]]
label = "Claude Code"
text = """
Claude Code can use Airc too: Settings › Agents › Add to Claude Code, then ask it to check something on a site you're signed in to. It works in its own page, and you can watch from the Agents folder.
"""

[[post]]
label = "Activity (standalone)"
media = ["activity:16x9"]
text = """
Curious what an AI agent did in your browser? Airc keeps a week of it in Settings › Agents › Activity: which site and what kind of action. Never what it read or typed. New in Airc 0.1.16.
"""
