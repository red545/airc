slug = "2026-11-19-release-0.1.40"
title = "Airc 0.1.40: keychain safety; every window can be closed"
kind = "release"
since = "0.1.40"
tag = ""
summary = """
Two text posts: your saved passwords and cookies stay safe when macOS can't unlock the keychain, and every window can
be closed (⌘W on the last tab, as in Arc). The Command Bar speed-up has no number, so no post.
"""
order = """
1. Two afternoon posts on the first free days after LIVE.
"""
checked = """
- Keychain: when the keychain is locked, access is denied or the key doesn't match, Airc asks Try Again (or continue
  without saved passwords for now, or quit); nothing is deleted, no new key replaces yours, logins and cookies return
  once it opens. Before, a key that couldn't be read could be replaced and cookies signed out: the post says so.
- Windows: with the sidebar hidden, the window buttons appear at the top-left corner (and in the slid-out sidebar);
  ⌘W on a window's last tab closes the window, as in Arc; the last window stays with its empty page.
- Not posted: "Typing in the Command Bar is quicker" (no number in the notes).
- Not in 0.1.40 (release052): agentux2's agent button and connect, profilejourney.
"""

[[post]]
label = "Your passwords survive a locked keychain"
text = """
A fix in Airc 0.1.40: if macOS can't unlock the keychain, Airc now asks you to Try Again instead of starting over. Nothing is deleted and no new key replaces yours, so your saved passwords and cookies come back once it opens.
"""

[[post]]
label = "Every window can be closed"
text = """
⌘W on a window's last tab now closes the window, as in Arc. And with the sidebar hidden, move to the top-left corner and the window buttons appear. New in Airc 0.1.40.
"""
