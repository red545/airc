# Airc 0.1.31 (cut 269b1c6c; build revision be46a6d4; notes on release/0.1.31-notes). Claims from its approved notes,
# "New since 0.1.30". NOT TO POST before release043 says LIVE for 0.1.31: plan and approve only then, after checking
# the public repo shows the release (owner rule).
slug = "2026-11-18-release-0.1.31"
title = "Airc 0.1.31: your own Claude Code as the agent; every app asked once"
kind = "release"
since = "0.1.31"
tag = ""
summary = """
Two text posts: the Airc Agent on your own Claude Code or Codex (no API key needed), and the security change, told
plainly. No new shots in the cut.
"""
order = """
1. The agent post at 10:30 UTC on the first day after LIVE whose 10:30 can move; the security post a day later.
"""
checked = """
- Agent: Settings › AI › Agent › Use → Your Claude Code or Your Codex instead of an API key; Airc runs the installed copy
  with its own login, Airc never sees that login; only Airc's browser tools; still asks
  before it pays, sends, posts or deletes.
- Security: Airc asks every app or script once before it can use the browser and recognises each by what actually runs
  (signed app by its signer, script by file and contents, unsigned program by its code, SSH by the computer); before,
  a plain script could use the approval of the app that started it; some allowed apps (mostly scripts, node/python3
  tools) are asked once more; the reporter thanked, unnamed (release043).
- The Airc Agent is still a beta (0.1.22 Please know): the agent post says so.
- Neutral on plans: no "your Claude plan/subscription" line (release044, 2026-11-18: owner decision pending), so the
  post no longer says "it counts against your plan".
"""

[[post]]
label = "Airc Agent on your own Claude Code or Codex"
text = """
Airc Agent (beta) can now run on your own Claude Code or Codex instead of an API key. Airc uses the copy installed on your Mac, with its own login, which Airc never sees. It still asks before it pays or sends. New in Airc 0.1.31.
"""

[[post]]
label = "Security: every app asked once"
text = """
A security fix in Airc 0.1.31: every app or script now asks once before it can use your browser, recognised by what actually runs, not the name it gives. Before, a script could borrow the approval of the app that started it. Thanks to the person who reported it.
"""
