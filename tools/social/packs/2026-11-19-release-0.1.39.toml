[[post]]
label = "Developer Tools dock in the window"
text = """
Developer Tools now dock inside the window you're inspecting in Airc 0.1.39, at the bottom or the side like Chrome: ⌥⌘I, ⌥⌘J for the Console, ⌥⌘C to pick an element. ⇧⌘D switches sides, drag the divider, undock and redock.
"""

[[post]]
label = "Agent: set up your own Claude Code or Codex"
media = ["connect:16x9"]
text = """
Use your ChatGPT subscription in Airc's AI sidebar: no Codex yet? Install… shows the official install command, Sign in… starts Codex's own sign-in, and your task carries on. Your own Claude Code works the same way. Airc never sees a password. Beta, 0.1.39.
"""

[[post]]
label = "A quieter agent pane"
text = """
Airc's agent pane got much lighter while it thinks: the "Thinking…" shimmer now runs on Core Animation, so its CPU use drops from about 16% of a core to under 1%. New in Airc 0.1.39.
"""
