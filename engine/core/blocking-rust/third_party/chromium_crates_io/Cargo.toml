[package]
name = "airc-blocking"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
adblock = { version = "=0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
serde = "=1.0.229"
serde_json = "=1.0.149"

[features]
measure-heap = []

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
