name: Bug report
description: Something in Airc doesn't work or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Issues are public. Don't paste passwords, cookies, private URLs or your Space and tab names; blur them in screenshots. Security problems go to Send Feedback in Airc instead.
  - type: input
    id: version
    attributes:
      label: Airc version
      description: Airc menu › About Airc
      placeholder: "0.1.38"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.2"
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: [Chromium (default), Safari's engine (WebKit), Not sure]
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected and actual
      placeholder: |
        1. …
        2. …
        Expected: …
        Actual: …
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording (optional)
